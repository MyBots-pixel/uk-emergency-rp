<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UK Emergency RP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
    }

    #interaction {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);

      display: none;

      padding: 12px 20px;

      color: white;
      background: rgba(10, 15, 25, 0.92);

      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;

      font-size: 16px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35);

      pointer-events: none;
    }

    #interaction span {
      display: inline-block;

      margin-right: 8px;
      padding: 5px 9px;

      color: #111;
      background: white;

      border-radius: 6px;

      font-weight: 800;
    }

    #crosshair {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: white;

      font-size: 20px;
      font-weight: bold;

      pointer-events: none;

      text-shadow:
        0 1px 3px black;
    }

    #controls {
      position: fixed;

      left: 20px;
      bottom: 20px;

      padding: 12px 16px;

      color: white;

      background: rgba(0, 0, 0, 0.6);

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.7;

      pointer-events: none;
    }

    #hud {
      position: fixed;

      top: 20px;
      left: 20px;

      min-width: 220px;

      padding: 14px 16px;

      color: white;

      background: rgba(10, 15, 25, 0.82);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 12px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);

      pointer-events: none;
    }

    #hudTitle {
      margin-bottom: 8px;

      font-size: 18px;
      font-weight: 800;
    }

    .hudRow {
      display: flex;
      justify-content: space-between;

      gap: 25px;

      margin-top: 4px;

      font-size: 13px;
    }

    .hudValue {
      font-weight: 700;
    }

    #wanted {
      display: none;

      position: fixed;

      top: 20px;
      right: 20px;

      padding: 12px 16px;

      color: white;

      background: rgba(120, 0, 0, 0.85);

      border: 1px solid rgba(255, 255, 255, 0.15);

      border-radius: 10px;

      font-weight: 700;
    }

    #mouseHint {
      position: fixed;

      right: 20px;
      bottom: 20px;

      padding: 10px 14px;

      color: white;

      background: rgba(0, 0, 0, 0.55);

      border-radius: 9px;

      font-size: 12px;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <div id="hud">

    <div id="hudTitle">
      UK Emergency RP
    </div>

    <div class="hudRow">
      <span>Job</span>

      <span
        id="job"
        class="hudValue"
      >
        Civilian
      </span>
    </div>

    <div class="hudRow">
      <span>Money</span>

      <span
        id="money"
        class="hudValue"
      >
        £500
      </span>
    </div>

    <div class="hudRow">
      <span>XP</span>

      <span
        id="xp"
        class="hudValue"
      >
        0
      </span>
    </div>

  </div>


  <div id="wanted">

    🚨 WANTED

    <span id="wantedLevel">
      0
    </span>

  </div>


  <div id="crosshair">
    +
  </div>


  <div id="interaction">

    <span>E</span>

    <b id="interactionText">
      Interact
    </b>

  </div>


  <div id="controls">

    <b>W A S D</b> Move<br>
    <b>SHIFT</b> Sprint<br>
    <b>E</b> Interact

  </div>


  <div id="mouseHint">

    Hold <b>RIGHT CLICK</b> + move mouse to look

  </div>


  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import { createPlayer } from "./player.js";


    // ==================================================
    // GAME SETUP
    // ==================================================

    const game =
      document.getElementById("game");


    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0x87ceeb
      );


    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.shadowMap.enabled =
      true;


    game.appendChild(
      renderer.domElement
    );


    // ==================================================
    // LIGHTING
    // ==================================================

    const sunlight =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );


    sunlight.position.set(
      50,
      100,
      50
    );


    sunlight.castShadow =
      true;


    scene.add(
      sunlight
    );


    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        0.6
      );


    scene.add(
      ambient
    );


    // ==================================================
    // GROUND
    // ==================================================

    const ground =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          500,
          500
        ),

        new THREE.MeshStandardMaterial({
          color: 0x3b7d3b
        })
      );


    ground.rotation.x =
      -Math.PI / 2;


    ground.receiveShadow =
      true;


    scene.add(
      ground
    );


    // ==================================================
    // ROAD
    // ==================================================

    const road =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          30,
          0.1,
          500
        ),

        new THREE.MeshStandardMaterial({
          color: 0x333333
        })
      );


    road.position.y =
      0.05;


    scene.add(
      road
    );


    // ==================================================
    // ROAD MARKINGS
    // ==================================================

    const roadLineMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffffff
      });


    for (
      let z = -240;
      z < 240;
      z += 10
    ) {

      const line =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.25,
            0.03,
            5
          ),

          roadLineMaterial
        );


      line.position.set(
        0,
        0.12,
        z
      );


      scene.add(
        line
      );

    }


    // ==================================================
    // PLAYER
    // ==================================================

    const player =
      createPlayer();


    player.position.set(
      0,
      0,
      10
    );


    scene.add(
      player
    );


    // ==================================================
    // CAMERA SETTINGS
    // ==================================================

    let cameraYaw =
      0;


    let cameraPitch =
      0.25;


    const cameraDistance =
      9;


    const cameraHeight =
      3.2;


    const mouseSensitivity =
      0.004;


    let rightMouseDown =
      false;


    // ==================================================
    // KEYBOARD
    // ==================================================

    const keys = {};


    window.addEventListener(
      "keydown",
      event => {

        keys[
          event.key.toLowerCase()
        ] = true;


        if (
          event.key.toLowerCase()
          === "e"
        ) {

          interact();

        }

      }
    );


    window.addEventListener(
      "keyup",
      event => {

        keys[
          event.key.toLowerCase()
        ] = false;

      }
    );


    // ==================================================
    // RIGHT MOUSE CAMERA
    // ==================================================

    renderer.domElement.addEventListener(
      "contextmenu",
      event => {

        event.preventDefault();

      }
    );


    renderer.domElement.addEventListener(
      "mousedown",
      event => {

        if (
          event.button === 2
        ) {

          rightMouseDown =
            true;

        }

      }
    );


    window.addEventListener(
      "mouseup",
      event => {

        if (
          event.button === 2
        ) {

          rightMouseDown =
            false;

        }

      }
    );


    window.addEventListener(
      "mousemove",
      event => {

        if (
          !rightMouseDown
        ) {

          return;

        }


        cameraYaw -=
          event.movementX *
          mouseSensitivity;


        cameraPitch -=
          event.movementY *
          mouseSensitivity;


        cameraPitch =
          THREE.MathUtils.clamp(
            cameraPitch,
            -0.45,
            0.8
          );

      }
    );


    // ==================================================
    // INTERACTION
    // ==================================================

    let nearbyInteraction =
      null;


    function interact() {

      if (
        !nearbyInteraction
      ) {

        return;

      }


      console.log(
        "Interaction:",
        nearbyInteraction
      );


      alert(
        nearbyInteraction
      );

    }


    // ==================================================
    // BUILDINGS
    // ==================================================

    function createBuilding(
      x,
      z,
      width,
      depth,
      height
    ) {

      const building =
        new THREE.Group();


      const body =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            width,
            height,
            depth
          ),

          new THREE.MeshStandardMaterial({
            color: 0xb8b8b8
          })
        );


      body.position.y =
        height / 2;


      body.castShadow =
        true;


      body.receiveShadow =
        true;


      building.add(
        body
      );


      // --------------------------
      // FRONT WINDOWS
      // --------------------------

      const windowMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x72b7d9,
          metalness: 0.2,
          roughness: 0.2
        });


      for (
        let y = 2;
        y < height;
        y += 3
      ) {

        for (
          let wx =
            -width / 2 + 2;

          wx <
            width / 2;

          wx += 4
        ) {

          const window =
            new THREE.Mesh(
              new THREE.BoxGeometry(
                1.5,
                1.3,
                0.08
              ),

              windowMaterial
            );


          window.position.set(
            wx,
            y,
            depth / 2 + 0.05
          );


          building.add(
            window
          );

        }

      }


      // --------------------------
      // BACK WINDOWS
      // --------------------------

      for (
        let y = 2;
        y < height;
        y += 3
      ) {

        for (
          let wx =
            -width / 2 + 2;

          wx <
            width / 2;

          wx += 4
        ) {

          const window =
            new THREE.Mesh(
              new THREE.BoxGeometry(
                1.5,
                1.3,
                0.08
              ),

              windowMaterial
            );


          window.position.set(
            wx,
            y,
            -depth / 2 - 0.05
          );


          building.add(
            window
          );

        }

      }


      building.position.set(
        x,
        0,
        z
      );


      scene.add(
        building
      );

    }


    // ==================================================
    // CITY
    // ==================================================

    createBuilding(
      -35,
      -30,
      20,
      20,
      15
    );


    createBuilding(
      35,
      -50,
      25,
      20,
      20
    );


    createBuilding(
      -35,
      30,
      18,
      25,
      12
    );


    createBuilding(
      35,
      40,
      25,
      20,
      18
    );


    // ==================================================
    // INTERACTION POINT
    // ==================================================

    const interactionPoint =
      new THREE.Vector3(
        0,
        0,
        0
      );


    // ==================================================
    // CLOCK
    // ==================================================

    const clock =
      new THREE.Clock();


    // ==================================================
    // CAMERA CALCULATION
    // ==================================================

    function updateCamera(
      delta
    ) {

      const target =
        new THREE.Vector3(
          player.position.x,
          player.position.y + 1.5,
          player.position.z
        );


      const horizontalDistance =
        Math.cos(
          cameraPitch
        ) *
        cameraDistance;


      const verticalDistance =
        Math.sin(
          cameraPitch
        ) *
        cameraDistance;


      const cameraX =
        target.x -
        Math.sin(cameraYaw) *
        horizontalDistance;


      const cameraZ =
        target.z -
        Math.cos(cameraYaw) *
        horizontalDistance;


      const desiredPosition =
        new THREE.Vector3(
          cameraX,
          target.y + cameraHeight + verticalDistance,
          cameraZ
        );


      const smoothing =
        1 -
        Math.pow(
          0.001,
          delta
        );


      camera.position.lerp(
        desiredPosition,
        smoothing
      );


      camera.lookAt(
        target
      );

    }


    // ==================================================
    // PLAYER MOVEMENT
    // ==================================================

    function updatePlayer(
      delta
    ) {

      let forward =
        0;


      let sideways =
        0;


      if (
        keys["w"]
      ) {

        forward += 1;

      }


      if (
        keys["s"]
      ) {

        forward -= 1;

      }


      if (
        keys["d"]
      ) {

        sideways += 1;

      }


      if (
        keys["a"]
      ) {

        sideways -= 1;

      }


      const moving =
        forward !== 0 ||
        sideways !== 0;


      if (
        !moving
      ) {

        player.userData.sprinting =
          false;

        return;

      }


      // Sprint

      let speed =
        6;


      if (
        keys["shift"]
      ) {

        speed =
          11;

        player.userData.sprinting =
          true;

      } else {

        player.userData.sprinting =
          false;

      }


      // Normalize diagonal movement

      const length =
        Math.sqrt(
          forward * forward +
          sideways * sideways
        );


      forward /=
        length;


      sideways /=
        length;


      // Camera-relative movement

      const forwardX =
        Math.sin(
          cameraYaw
        );


      const forwardZ =
        Math.cos(
          cameraYaw
        );


      const rightX =
        Math.cos(
          cameraYaw
        );


      const rightZ =
        -Math.sin(
          cameraYaw
        );


      const moveX =
        (
          forwardX *
          forward
        ) +
        (
          rightX *
          sideways
        );


      const moveZ =
        (
          forwardZ *
          forward
        ) +
        (
          rightZ *
          sideways
        );


      const movement =
        speed *
        delta;


      player.position.x +=
        moveX *
        movement;


      player.position.z +=
        moveZ *
        movement;


      // Character faces movement direction

      const targetRotation =
        Math.atan2(
          moveX,
          moveZ
        );


      let rotationDifference =
        targetRotation -
        player.rotation.y;


      rotationDifference =
        Math.atan2(
          Math.sin(
            rotationDifference
          ),
          Math.cos(
            rotationDifference
          )
        );


      player.rotation.y +=
        rotationDifference *
        Math.min(
          1,
          delta * 12
        );

    }


    // ==================================================
    // GAME LOOP
    // ==================================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      updatePlayer(
        delta
      );


      updateCamera(
        delta
      );


      // ==================================================
      // INTERACTION RANGE
      // ==================================================

      const distance =
        player.position.distanceTo(
          interactionPoint
        );


      const interaction =
        document.getElementById(
          "interaction"
        );


      if (
        distance < 8
      ) {

        nearbyInteraction =
          "Open City Interaction";


        interaction.style.display =
          "block";


        document.getElementById(
          "interactionText"
        ).textContent =
          nearbyInteraction;

      } else {

        nearbyInteraction =
          null;


        interaction.style.display =
          "none";

      }


      // ==================================================
      // HUD
      // ==================================================

      document.getElementById(
        "job"
      ).textContent =
        player.userData.job;


      document.getElementById(
        "money"
      ).textContent =
        "£" +
        player.userData.money;


      document.getElementById(
        "xp"
      ).textContent =
        player.userData.xp;


      // ==================================================
      // WANTED
      // ==================================================

      const wanted =
        document.getElementById(
          "wanted"
        );


      const wantedLevel =
        player.userData.wantedLevel;


      if (
        wantedLevel > 0
      ) {

        wanted.style.display =
          "block";


        document.getElementById(
          "wantedLevel"
        ).textContent =
          wantedLevel;

      } else {

        wanted.style.display =
          "none";

      }


      // ==================================================
      // RENDER
      // ==================================================

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ==================================================
    // WINDOW RESIZE
    // ==================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
