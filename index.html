<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UK Response RP</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- 3D GAME -->
    <div id="game"></div>

    <!-- HUD -->
    <div id="hud">

        <!-- XP -->
        <div id="xpPanel">
            <div id="jobName">👤 CIVILIAN</div>

            <div id="levelText">
                LEVEL 1
            </div>

            <div id="xpText">
                0 / 1000 XP
            </div>

            <div class="xpBackground">
                <div id="xpBar"></div>
            </div>

            <div id="xpReason">
                Ready.
            </div>
        </div>

        <!-- MONEY -->
        <div id="moneyPanel">
            💷 £<span id="money">500</span>
        </div>

        <!-- WANTED -->
        <div id="wantedPanel">
            🚨 WANTED
            <span id="wantedStars">0</span>/5
        </div>

        <!-- CONTROLS -->
        <div id="controls">
            WASD Move · SHIFT Sprint · E Interact · TAB Menu · P Phone · T Radio · RMB Camera
        </div>

        <!-- INTERACTION -->
        <div id="interaction">
            <span class="key">E</span>
            <span id="interactionText">Interact</span>
        </div>

        <!-- NOTIFICATIONS -->
        <div id="notification"></div>

        <div id="xpNotification"></div>

    </div>


    <!-- CHAT -->

    <div id="chat" class="panel hidden">

        <div class="panelTitle">
            💬 CHAT
        </div>

        <div id="chatMessages"></div>

        <div class="chatInput">

            <input
                id="chatInput"
                maxlength="180"
                placeholder="Type a message..."
            >

            <button id="chatSend">
                SEND
            </button>

        </div>

    </div>


    <!-- RADIAL MENU -->

    <div id="radialOverlay" class="hidden">

        <div id="radial">

            <div id="radialCenter">
                TAB
                <small>Select</small>
            </div>


            <button
                class="radialItem top"
                data-action="police"
            >
                🚔
                <span>Police</span>
            </button>


            <button
                class="radialItem topRight"
                data-action="ambulance"
            >
                🚑
                <span>Ambulance</span>
            </button>


            <button
                class="radialItem right"
                data-action="vehicles"
            >
                🚗
                <span>Vehicles</span>
            </button>


            <button
                class="radialItem bottomRight"
                data-action="civilian"
            >
                👤
                <span>Civilian</span>
            </button>


            <button
                class="radialItem bottom"
                data-action="hems"
            >
                🚁
                <span>HEMS</span>
            </button>


            <button
                class="radialItem bottomLeft"
                data-action="fire"
            >
                🚒
                <span>Fire</span>
            </button>


            <button
                class="radialItem left"
                data-action="phone"
            >
                📱
                <span>Phone</span>
            </button>


            <button
                class="radialItem topLeft"
                data-action="settings"
            >
                ⚙️
                <span>Settings</span>
            </button>

        </div>

    </div>


    <!-- PHONE -->

    <div id="phone" class="device hidden">

        <div class="phoneScreen">

            <div class="phoneHeader">

                📱 UK RESPONSE

                <button data-close="phone">
                    ×
                </button>

            </div>


            <div class="phoneApps">

                <button data-phone="radio">
                    📻
                    <span>Radio</span>
                </button>

                <button data-phone="vehicles">
                    🚗
                    <span>Vehicles</span>
                </button>

                <button data-phone="events">
                    🌌
                    <span>Events</span>
                </button>

                <button data-phone="wanted">
                    🚨
                    <span>Wanted</span>
                </button>

                <button data-phone="players">
                    👥
                    <span>Players</span>
                </button>

                <button data-phone="settings">
                    ⚙️
                    <span>Settings</span>
                </button>

                <button data-phone="chat">
                    💬
                    <span>Chat</span>
                </button>

                <button data-phone="jobs">
                    👔
                    <span>Jobs</span>
                </button>

            </div>


            <div id="phoneInformation">

                Welcome to UK Response RP.

            </div>

        </div>

    </div>


    <!-- GENERAL MODAL -->

    <div id="modal" class="modal hidden">

        <div class="modalBox">

            <div class="modalHeader">

                <span id="modalTitle">
                    Panel
                </span>

                <button id="modalClose">
                    ×
                </button>

            </div>


            <div id="modalBody"></div>

        </div>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel" class="modal hidden">

        <div class="modalBox adminBox">

            <div class="modalHeader">

                <span>
                    👑 OWNER ADMIN PANEL
                </span>

                <button data-close="adminPanel">
                    ×
                </button>

            </div>


            <div class="adminTabs">

                <button data-admin-tab="players">
                    PLAYERS
                </button>

                <button data-admin-tab="vehicles">
                    VEHICLES
                </button>

                <button data-admin-tab="events">
                    EVENTS
                </button>

                <button data-admin-tab="world">
                    WORLD
                </button>

            </div>


            <div id="adminBody"></div>

        </div>

    </div>


    <!-- THREE.JS -->

    <script type="module" src="app.js"></script>

</body>
</html>
