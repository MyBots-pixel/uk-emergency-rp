<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Emergency RP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #87ceeb;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      min-width: 230px;
      padding: 15px;
      color: white;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      z-index: 5;
      pointer-events: none;
    }

    #hudTitle {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .hudRow {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 14px;
    }

    .hudValue {
      font-weight: 700;
    }

    /* =========================
       WANTED
    ========================= */

    #wanted {
      display: none;
      position: fixed;
      right: 20px;
      top: 20px;
      padding: 12px 16px;
      color: white;
      background: rgba(150,0,0,0.9);
      border-radius: 10px;
      z-index: 5;
      font-weight: 700;
    }

    /* =========================
       CONTROLS
    ========================= */

    #controls {
      position: fixed;
      left: 20px;
      bottom: 20px;
      padding: 12px 16px;
      color: white;
      background: rgba(0,0,0,0.65);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      z-index: 5;
      pointer-events: none;
    }

    #mouseHint {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 10px 14px;
      color: white;
      background: rgba(0,0,0,0.6);
      border-radius: 9px;
      font-size: 12px;
      z-index: 5;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 1px 3px black;
      pointer-events: none;
      z-index: 5;
    }

    /* =========================
       E INTERACTION
    ========================= */

    #interaction {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      padding: 12px 20px;
      color: white;
      background: rgba(10,15,25,0.94);
      border-radius: 10px;
      z-index: 10;
      pointer-events: none;
    }

    #interaction span {
      display: inline-block;
      margin-right: 8px;
      padding: 5px 9px;
      color: #111;
      background: white;
      border-radius: 6px;
      font-weight: 800;
    }

    /* =========================
       VEHICLE MENU
    ========================= */

    #vehicleMenu {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      max-width: 90vw;
      max-height: 75vh;
      overflow-y: auto;
      padding: 24px;
      color: white;
      background: rgba(10,15,25,0.97);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      z-index: 20;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }

    #vehicleMenu h2 {
      margin-top: 0;
    }

    #vehicleMenu p {
      color: #aab3c5;
      font-size: 13px;
    }

    .vehicleCard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 12px;
      padding: 14px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
    }

    .vehicleInfo strong {
      display: block;
      margin-bottom: 4px;
    }

    .vehicleInfo small {
      color: #aab3c5;
    }

    .vehicleButton {
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      color: white;
      background: #2563eb;
      cursor: pointer;
      font-weight: 700;
    }

    .vehicleButton:hover {
      background: #1d4ed8;
    }

    #closeVehicleMenu {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      border: none;
      border-radius: 9px;
      color: white;
      background: #333;
      cursor: pointer;
    }

    /* =========================
       NOTIFICATION
    ========================= */

    #notification {
      display: none;
      position: fixed;
      left: 50%;
      top: 25px;
      transform: translateX(-50%);
      padding: 12px 20px;
      color: white;
      background: rgba(10,15,25,0.95);
      border-radius: 10px;
      z-index: 30;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      position: fixed;
      left: 20px;
      bottom: 125px;
      width: 350px;
      max-width: calc(100vw - 40px);
      z-index: 15;
    }

    #chatMessages {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 210px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 7px;

      background: rgba(0,0,0,0.38);
      border-radius: 9px;

      scrollbar-width: thin;
    }

    .chatMessage {
      width: fit-content;
      max-width: 100%;
      padding: 6px 9px;
      color: white;
      background: rgba(10,15,25,0.82);
      border-radius: 7px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .chatName {
      font-weight: 800;
      margin-right: 5px;
    }

    #chatInputArea {
      display: flex;
      gap: 6px;
    }

    #chatInput {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;

      color: white;
      background: rgba(10,15,25,0.94);

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;

      outline: none;
      font-size: 13px;
    }

    #chatInput:focus {
      border-color: #3b82f6;
    }

    #chatSend {
      padding: 10px 13px;

      color: white;
      background: #2563eb;

      border: none;
      border-radius: 8px;

      cursor: pointer;
      font-weight: 700;
    }

    #chatHint {
      margin-top: 4px;
      color: rgba(255,255,255,0.65);
      font-size: 10px;
    }

  </style>
</head>

<body>

  <div id="game"></div>

  <!-- HUD -->

  <div id="hud">

    <div id="hudTitle">
      UK Emergency RP
    </div>

    <div class="hudRow">
      <span>Job</span>
      <span id="job" class="hudValue">
        Civilian
      </span>
    </div>

    <div class="hudRow">
      <span>Money</span>
      <span id="money" class="hudValue">
        £500
      </span>
    </div>

    <div class="hudRow">
      <span>XP</span>
      <span id="xp" class="hudValue">
        0
      </span>
    </div>

  </div>


  <!-- WANTED -->

  <div id="wanted">

    🚨 WANTED

    <span id="wantedLevel">
      0
    </span>

  </div>


  <!-- CROSSHAIR -->

  <div id="crosshair">
    +
  </div>


  <!-- INTERACTION -->

  <div id="interaction">

    <span>
      E
    </span>

    <b id="interactionText">
      Interact
    </b>

  </div>


  <!-- CHAT -->

  <div id="chat">

    <div id="chatMessages"></div>

    <div id="chatInputArea">

      <input
        id="chatInput"
        type="text"
        maxlength="200"
        autocomplete="off"
        placeholder="Press Enter to chat..."
      >

      <button id="chatSend">
        Send
      </button>

    </div>

    <div id="chatHint">
      Enter = chat • Escape = close
    </div>

  </div>


  <!-- CONTROLS -->

  <div id="controls">

    <b>W A S D</b>
    Move / Drive

    <br>

    <b>SHIFT</b>
    Sprint / Speed

    <br>

    <b>E</b>
    Interact

    <br>

    <b>ENTER</b>
    Chat

  </div>


  <!-- MOUSE -->

  <div id="mouseHint">
    Hold <b>RIGHT CLICK</b> + move mouse
  </div>


  <!-- VEHICLE MENU -->

  <div id="vehicleMenu">

    <h2>
      🚗 Vehicle Dealership
    </h2>

    <p>
      Choose a vehicle.
    </p>

    <div id="vehicleList"></div>

    <button id="closeVehicleMenu">
      Close
    </button>

  </div>


  <!-- NOTIFICATION -->

  <div id="notification"></div>


  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    // ==================================================
    // GAME SETUP
    // ==================================================

    const game =
      document.getElementById("game");


    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(0x87ceeb);


    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.shadowMap.enabled =
      true;


    game.appendChild(
      renderer.domElement
    );


    // ==================================================
    // LIGHTING
    // ==================================================

    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );


    sun.position.set(
      50,
      100,
      50
    );


    sun.castShadow =
      true;


    scene.add(sun);


    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        0.65
      );


    scene.add(ambient);


    // ==================================================
    // GROUND
    // ==================================================

    const ground =
      new THREE.Mesh(

        new THREE.PlaneGeometry(
          500,
          500
        ),

        new THREE.MeshStandardMaterial({
          color: 0x3d813d
        })

      );


    ground.rotation.x =
      -Math.PI / 2;


    ground.receiveShadow =
      true;


    scene.add(ground);


    // ==================================================
    // ROAD
    // ==================================================

    const road =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          30,
          0.1,
          500
        ),

        new THREE.MeshStandardMaterial({
          color: 0x303030
        })

      );


    road.position.y =
      0.05;


    scene.add(road);


    // ==================================================
    // ROAD MARKINGS
    // ==================================================

    for (
      let z = -240;
      z <= 240;
      z += 10
    ) {

      const line =
        new THREE.Mesh(

          new THREE.BoxGeometry(
            0.22,
            0.04,
            5
          ),

          new THREE.MeshStandardMaterial({
            color: 0xffffff
          })

        );


      line.position.set(
        0,
        0.12,
        z
      );


      scene.add(line);

    }


    // ==================================================
    // CHARACTER
    // ==================================================

    function createCharacter() {

      const character =
        new THREE.Group();


      const legMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x202020
        });


      const leftLeg =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.35,
            1,
            0.35
          ),
          legMaterial
        );


      leftLeg.position.set(
        -0.22,
        0.5,
        0
      );


      character.add(
        leftLeg
      );


      const rightLeg =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.35,
            1,
            0.35
          ),
          legMaterial
        );


      rightLeg.position.set(
        0.22,
        0.5,
        0
      );


      character.add(
        rightLeg
      );


      const body =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.9,
            1.15,
            0.5
          ),
          new THREE.MeshStandardMaterial({
            color: 0x2455a6
          })
        );


      body.position.y =
        1.45;


      character.add(
        body
      );


      const head =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            0.38,
            20,
            20
          ),
          new THREE.MeshStandardMaterial({
            color: 0xf0bd91
          })
        );


      head.position.y =
        2.3;


      character.add(
        head
      );


      const armMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x2455a6
        });


      const leftArm =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.3,
            1,
            0.3
          ),
          armMaterial
        );


      leftArm.position.set(
        -0.62,
        1.45,
        0
      );


      character.add(
        leftArm
      );


      const rightArm =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.3,
            1,
            0.3
          ),
          armMaterial
        );


      rightArm.position.set(
        0.62,
        1.45,
        0
      );


      character.add(
        rightArm
      );


      character.userData = {

        job: "Civilian",

        money: 500,

        xp: 0,

        wantedLevel: 0,

        sprinting: false,

        inVehicle: false,

        vehicle: null

      };


      return character;

    }


    const player =
      createCharacter();


    player.position.set(
      0,
      0,
      10
    );


    scene.add(player);


    // ==================================================
    // CAMERA
    // ==================================================

    let cameraYaw =
      0;


    let cameraPitch =
      0.25;


    let rightMouseDown =
      false;


    const mouseSensitivity =
      0.004;


    // ==================================================
    // KEYBOARD
    // ==================================================

    const keys = {};


    window.addEventListener(
      "keydown",
      event => {

        const key =
          event.key.toLowerCase();


        // Don't move player while typing

        if (
          document.activeElement ===
          chatInput
        ) {

          if (
            key === "escape"
          ) {

            chatInput.blur();

          }

          return;

        }


        keys[key] =
          true;


        if (
          key === "e"
        ) {

          handleInteraction();

        }


        if (
          key === "enter"
        ) {

          openChat();

        }

      }
    );


    window.addEventListener(
      "keyup",
      event => {

        keys[
          event.key.toLowerCase()
        ] = false;

      }
    );


    // ==================================================
    // RIGHT MOUSE CAMERA
    // ==================================================

    renderer.domElement.addEventListener(
      "contextmenu",
      event => {

        event.preventDefault();

      }
    );


    renderer.domElement.addEventListener(
      "mousedown",
      event => {

        if (
          event.button === 2
        ) {

          rightMouseDown =
            true;

        }

      }
    );


    window.addEventListener(
      "mouseup",
      event => {

        if (
          event.button === 2
        ) {

          rightMouseDown =
            false;

        }

      }
    );


    window.addEventListener(
      "mousemove",
      event => {

        if (
          !rightMouseDown
        ) {

          return;

        }


        cameraYaw -=
          event.movementX *
          mouseSensitivity;


        cameraPitch -=
          event.movementY *
          mouseSensitivity;


        cameraPitch =
          THREE.MathUtils.clamp(
            cameraPitch,
            -0.45,
            0.8
          );

      }
    );


    // ==================================================
    // VEHICLES
    // ==================================================

    const vehicles = [

      {
        id: "hatchback",
        name: "UK Hatchback",
        price: 0,
        type: "Civilian",
        color: 0xffffff
      },

      {
        id: "saloon",
        name: "UK Saloon",
        price: 2500,
        type: "Civilian",
        color: 0x222222
      },

      {
        id: "suv",
        name: "UK SUV",
        price: 5000,
        type: "Civilian",
        color: 0x555555
      },

      {
        id: "police",
        name: "Police Response",
        price: 15000,
        type: "Police",
        color: 0x111111,
        emergency: true
      },

      {
        id: "fire",
        name: "Fire Engine",
        price: 30000,
        type: "Fire",
        color: 0xcc2222,
        emergency: true
      },

      {
        id: "ambulance",
        name: "Ambulance",
        price: 25000,
        type: "Ambulance",
        color: 0xffffff,
        emergency: true
      },

      {
        id: "hems",
        name: "HEMS Response",
        price: 50000,
        type: "HEMS",
        color: 0xffff00,
        emergency: true
      }

    ];


    let currentVehicle =
      null;


    let currentVehicleData =
      null;


    let inVehicle =
      false;


    // ==================================================
    // VEHICLE CREATION
    // ==================================================

    function createVehicle(data) {

      const vehicle =
        new THREE.Group();


      const body =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            2.2,
            0.7,
            4.2
          ),
          new THREE.MeshStandardMaterial({
            color: data.color
          })
        );


      body.position.y =
        0.9;


      body.castShadow =
        true;


      vehicle.add(body);


      const cabin =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.7,
            0.7,
            2
          ),
          new THREE.MeshStandardMaterial({
            color: data.color
          })
        );


      cabin.position.y =
        1.55;


      vehicle.add(cabin);


      const glass =
        new THREE.MeshStandardMaterial({
          color: 0x6098b5,
          metalness: 0.2,
          roughness: 0.2
        });


      const frontWindow =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.4,
            0.45,
            0.08
          ),
          glass
        );


      frontWindow.position.set(
        0,
        1.58,
        1.04
      );


      vehicle.add(
        frontWindow
      );


      const rearWindow =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.4,
            0.45,
            0.08
          ),
          glass
        );


      rearWindow.position.set(
        0,
        1.58,
        -1.04
      );


      vehicle.add(
        rearWindow
      );


      const wheelPositions = [

        [-1.12, 0.55, 1.3],

        [1.12, 0.55, 1.3],

        [-1.12, 0.55, -1.3],

        [1.12, 0.55, -1.3]

      ];


      for (
        const pos of wheelPositions
      ) {

        const wheel =
          new THREE.Mesh(
            new THREE.CylinderGeometry(
              0.42,
              0.42,
              0.3,
              20
            ),
            new THREE.MeshStandardMaterial({
              color: 0x111111
            })
          );


        wheel.rotation.z =
          Math.PI / 2;


        wheel.position.set(
          pos[0],
          pos[1],
          pos[2]
        );


        vehicle.add(wheel);

      }


      if (
        data.emergency
      ) {

        const lightBar =
          new THREE.Mesh(
            new THREE.BoxGeometry(
              1.3,
              0.16,
              0.35
            ),
            new THREE.MeshStandardMaterial({
              color: 0x004cff,
              emissive: 0x003cff,
              emissiveIntensity: 2
            })
          );


        lightBar.position.y =
          2;


        vehicle.add(
          lightBar
        );

      }


      vehicle.userData = {

        speed: 0,

        maxSpeed:
          data.type === "Fire"
            ? 12
            : 20,

        acceleration: 10,

        braking: 15,

        steering: 2.2,

        data: data

      };


      return vehicle;

    }


    // ==================================================
    // DEALERSHIP
    // ==================================================

    const dealership =
      new THREE.Group();


    dealership.position.set(
      8,
      0,
      0
    );


    scene.add(
      dealership
    );


    const dealershipBuilding =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          10,
          6,
          10
        ),
        new THREE.MeshStandardMaterial({
          color: 0x777777
        })
      );


    dealershipBuilding.position.y =
      3;


    dealership.add(
      dealershipBuilding
    );


    const buildingGlass =
      new THREE.MeshStandardMaterial({
        color: 0x4b9ac0
      });


    for (
      let x = -3;
      x <= 3;
      x += 2
    ) {

      const window =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.4,
            1.8,
            0.08
          ),
          buildingGlass
        );


      window.position.set(
        x,
        3,
        5.05
      );


      dealership.add(
        window
      );

    }


    // ==================================================
    // VEHICLE MENU
    // ==================================================

    const vehicleMenu =
      document.getElementById(
        "vehicleMenu"
      );


    const vehicleList =
      document.getElementById(
        "vehicleList"
      );


    function openVehicleMenu() {

      vehicleList.innerHTML =
        "";


      for (
        const vehicle of vehicles
      ) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "vehicleCard";


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "vehicleInfo";


        const title =
          document.createElement(
            "strong"
          );


        title.textContent =
          vehicle.name;


        const description =
          document.createElement(
            "small"
          );


        description.textContent =
          vehicle.type +
          " • £" +
          vehicle.price.toLocaleString();


        info.appendChild(
          title
        );


        info.appendChild(
          description
        );


        const button =
          document.createElement(
            "button"
          );


        button.className =
          "vehicleButton";


        button.textContent =
          vehicle.price === 0
            ? "Spawn"
            : "Buy";


        button.onclick =
          () => {

            spawnVehicle(
              vehicle
            );

          };


        card.appendChild(
          info
        );


        card.appendChild(
          button
        );


        vehicleList.appendChild(
          card
        );

      }


      vehicleMenu.style.display =
        "block";

    }


    document
      .getElementById(
        "closeVehicleMenu"
      )
      .onclick =
      () => {

        vehicleMenu.style.display =
          "none";

      };


    // ==================================================
    // NOTIFICATION
    // ==================================================

    function notify(message) {

      const notification =
        document.getElementById(
          "notification"
        );


      notification.textContent =
        message;


      notification.style.display =
        "block";


      setTimeout(
        () => {

          notification.style.display =
            "none";

        },
        2200
      );

    }


    // ==================================================
    // SPAWN VEHICLE
    // ==================================================

    function spawnVehicle(data) {

      if (
        currentVehicle
      ) {

        scene.remove(
          currentVehicle
        );

        currentVehicle =
          null;

      }


      if (
        player.userData.money <
        data.price
      ) {

        notify(
          "You don't have enough money."
        );

        return;

      }


      player.userData.money -=
        data.price;


      currentVehicle =
        createVehicle(data);


      currentVehicle.position.set(
        player.position.x + 4,
        0,
        player.position.z
      );


      currentVehicle.rotation.y =
        player.rotation.y;


      currentVehicleData =
        data;


      scene.add(
        currentVehicle
      );


      vehicleMenu.style.display =
        "none";


      notify(
        data.name +
        " spawned!"
      );

    }


    // ==================================================
    // ENTER VEHICLE
    // ==================================================

    function enterVehicle() {

      if (
        !currentVehicle
      ) {

        return;

      }


      const distance =
        player.position.distanceTo(
          currentVehicle.position
        );


      if (
        distance > 5
      ) {

        return;

      }


      inVehicle =
        true;


      player.userData.inVehicle =
        true;


      player.userData.vehicle =
        currentVehicle;


      player.visible =
        false;


      notify(
        "Entered " +
        currentVehicleData.name
      );

    }


    // ==================================================
    // EXIT VEHICLE
    // ==================================================

    function exitVehicle() {

      if (
        !currentVehicle
      ) {

        return;

      }


      inVehicle =
        false;


      player.userData.inVehicle =
        false;


      player.userData.vehicle =
        null;


      player.visible =
        true;


      player.position.set(
        currentVehicle.position.x + 3,
        0,
        currentVehicle.position.z
      );


      notify(
        "Exited vehicle."
      );

    }


    // ==================================================
    // INTERACTION
    // ==================================================

    function handleInteraction() {

      if (
        vehicleMenu.style.display ===
        "block"
      ) {

        return;

      }


      if (
        inVehicle
      ) {

        exitVehicle();

        return;

      }


      if (
        currentVehicle
      ) {

        const distance =
          player.position.distanceTo(
            currentVehicle.position
          );


        if (
          distance < 5
        ) {

          enterVehicle();

          return;

        }

      }


      const dealershipDistance =
        player.position.distanceTo(
          dealership.position
        );


      if (
        dealershipDistance < 12
      ) {

        openVehicleMenu();

        return;

      }


      notify(
        "Nothing to interact with here."
      );

    }


    // ==================================================
    // WALKING
    // ==================================================

    function updateWalking(delta) {

      let forward =
        0;


      let sideways =
        0;


      if (
        keys["w"]
      ) {

        forward += 1;

      }


      if (
        keys["s"]
      ) {

        forward -= 1;

      }


      if (
        keys["d"]
      ) {

        sideways += 1;

      }


      if (
        keys["a"]
      ) {

        sideways -= 1;

      }


      if (
        forward === 0 &&
        sideways === 0
      ) {

        return;

      }


      const speed =
        keys["shift"]
          ? 11
          : 6;


      const length =
        Math.sqrt(
          forward * forward +
          sideways * sideways
        );


      forward /=
        length;


      sideways /=
        length;


      const forwardX =
        Math.sin(
          cameraYaw
        );


      const forwardZ =
        Math.cos(
          cameraYaw
        );


      const rightX =
        Math.cos(
          cameraYaw
        );


      const rightZ =
        -Math.sin(
          cameraYaw
        );


      const moveX =
        forwardX * forward +
        rightX * sideways;


      const moveZ =
        forwardZ * forward +
        rightZ * sideways;


      player.position.x +=
        moveX *
        speed *
        delta;


      player.position.z +=
        moveZ *
        speed *
        delta;


      const targetRotation =
        Math.atan2(
          moveX,
          moveZ
        );


      let difference =
        targetRotation -
        player.rotation.y;


      difference =
        Math.atan2(
          Math.sin(difference),
          Math.cos(difference)
        );


      player.rotation.y +=
        difference *
        Math.min(
          1,
          delta * 12
        );

    }


    // ==================================================
    // DRIVING
    // ==================================================

    function updateDriving(delta) {

      if (
        !currentVehicle
      ) {

        return;

      }


      const data =
        currentVehicle.userData;


      let acceleration =
        0;


      if (
        keys["w"]
      ) {

        acceleration =
          1;

      }


      if (
        keys["s"]
      ) {

        acceleration =
          -1;

      }


      if (
        acceleration !== 0
      ) {

        data.speed +=
          acceleration *
          data.acceleration *
          delta;

      } else {

        if (
          data.speed > 0
        ) {

          data.speed -=
            data.braking *
            delta;

        }


        if (
          data.speed < 0
        ) {

          data.speed +=
            data.braking *
            delta;

        }

      }


      const maxSpeed =
        keys["shift"]
          ? data.maxSpeed * 1.5
          : data.maxSpeed;


      data.speed =
        THREE.MathUtils.clamp(
          data.speed,
          -maxSpeed / 2,
          maxSpeed
        );


      let steering =
        0;


      if (
        keys["a"]
      ) {

        steering =
          1;

      }


      if (
        keys["d"]
      ) {

        steering =
          -1;

      }


      if (
        Math.abs(data.speed) > 0.1
      ) {

        currentVehicle.rotation.y +=
          steering *
          data.steering *
          delta *
          (
            data.speed /
            maxSpeed
          );

      }


      currentVehicle.translateZ(
        data.speed *
        delta
      );


      player.position.copy(
        currentVehicle.position
      );


      player.position.y =
        0;


      player.rotation.y =
        currentVehicle.rotation.y;

    }


    // ==================================================
    // CAMERA
    // ==================================================

    function updateCamera(delta) {

      const target =
        inVehicle &&
        currentVehicle

          ? new THREE.Vector3(
              currentVehicle.position.x,
              1.5,
              currentVehicle.position.z
            )

          : new THREE.Vector3(
              player.position.x,
              1.5,
              player.position.z
            );


      const distance =
        inVehicle
          ? 11
          : 9;


      const horizontal =
        Math.cos(cameraPitch) *
        distance;


      const vertical =
        Math.sin(cameraPitch) *
        distance;


      const cameraX =
        target.x -
        Math.sin(cameraYaw) *
        horizontal;


      const cameraZ =
        target.z -
        Math.cos(cameraYaw) *
        horizontal;


      const desired =
        new THREE.Vector3(
          cameraX,
          target.y +
            3.2 +
            vertical,
          cameraZ
        );


      const smoothing =
        1 -
        Math.pow(
          0.001,
          delta
        );


      camera.position.lerp(
        desired,
        smoothing
      );


      camera.lookAt(
        target
      );

    }


    // ==================================================
    // INTERACTION UI
    // ==================================================

    function updateInteraction() {

      const interaction =
        document.getElementById(
          "interaction"
        );


      if (
        inVehicle
      ) {

        interaction.style.display =
          "block";


        document.getElementById(
          "interactionText"
        ).textContent =
          "Exit Vehicle";


        return;

      }


      if (
        currentVehicle
      ) {

        const distance =
          player.position.distanceTo(
            currentVehicle.position
          );


        if (
          distance < 5
        ) {

          interaction.style.display =
            "block";


          document.getElementById(
            "interactionText"
          ).textContent =
            "Enter Vehicle";


          return;

        }

      }


      const dealershipDistance =
        player.position.distanceTo(
          dealership.position
        );


      if (
        dealershipDistance < 12
      ) {

        interaction.style.display =
          "block";


        document.getElementById(
          "interactionText"
        ).textContent =
          "Open Dealership";


        return;

      }


      interaction.style.display =
        "none";

    }


    // ==================================================
    // HUD
    // ==================================================

    function updateHUD() {

      document.getElementById(
        "job"
      ).textContent =
        player.userData.job;


      document.getElementById(
        "money"
      ).textContent =
        "£" +
        player.userData.money
          .toLocaleString();


      document.getElementById(
        "xp"
      ).textContent =
        player.userData.xp;


      const wanted =
        document.getElementById(
          "wanted"
        );


      if (
        player.userData.wantedLevel > 0
      ) {

        wanted.style.display =
          "block";


        document.getElementById(
          "wantedLevel"
        ).textContent =
          player.userData.wantedLevel;

      } else {

        wanted.style.display =
          "none";

      }

    }


    // ==================================================
    // CHAT
    // ==================================================

    const chatInput =
      document.getElementById(
        "chatInput"
      );


    const chatMessages =
      document.getElementById(
        "chatMessages"
      );


    const chatSend =
      document.getElementById(
        "chatSend"
      );


    function openChat() {

      chatInput.focus();

    }


    function sendChatMessage() {

      const message =
        chatInput.value.trim();


      if (
        message.length === 0
      ) {

        return;

      }


      addChatMessage(
        "Player",
        message
      );


      chatInput.value =
        "";


      chatInput.blur();

    }


    function addChatMessage(
      name,
      message
    ) {

      const messageElement =
        document.createElement(
          "div"
        );


      messageElement.className =
        "chatMessage";


      const nameElement =
        document.createElement(
          "span"
        );


      nameElement.className =
        "chatName";


      nameElement.textContent =
        name + ":";


      const textElement =
        document.createElement(
          "span"
        );


      textElement.textContent =
        message;


      messageElement.appendChild(
        nameElement
      );


      messageElement.appendChild(
        textElement
      );


      chatMessages.appendChild(
        messageElement
      );


      chatMessages.scrollTop =
        chatMessages.scrollHeight;


      // Keep chat from getting huge

      while (
        chatMessages.children.length >
        50
      ) {

        chatMessages.removeChild(
          chatMessages.firstChild
        );

      }

    }


    chatSend.addEventListener(
      "click",
      sendChatMessage
    );


    chatInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendChatMessage();

        }


        if (
          event.key === "Escape"
        ) {

          chatInput.value =
            "";

          chatInput.blur();

        }

      }
    );


    // ==================================================
    // GAME LOOP
    // ==================================================

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      if (
        inVehicle
      ) {

        updateDriving(
          delta
        );

      } else {

        updateWalking(
          delta
        );

      }


      updateCamera(
        delta
      );


      updateInteraction();

      updateHUD();


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ==================================================
    // RESIZE
    // ==================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
